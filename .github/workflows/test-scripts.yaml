# Runs the bash test suite for the submission check and assign scripts.

name: Test Scripts

on:
  pull_request:
    paths:
      - '.github/scripts/**'
      - '.github/workflows/test-scripts.yaml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install DuckDB
        run: |
          curl -fsSL "https://github.com/duckdb/duckdb/releases/latest/download/duckdb-cli-linux-amd64.tar.gz" | sudo tar -xz -C /usr/local/bin duckdb

      - name: Run script tests
        run: bash .github/scripts/test.sh
