- file: wnba_finals_avg_attendance.png
  alt: >
    Line chart of average attendance per game at the WNBA Finals from 2002 to
    2025, with point size showing the number of games in each series. Averages
    mostly range between about 10,000 and 17,000 fans per game. The lowest is
    2019 at about 6,000, there is a gap in 2020 when the bubble Finals had no
    fans, and the highest is 2024 at 18,520 per game before falling to about
    13,700 in 2025.
