title: "AmphibiaWeb"
article:
  title: "Pleistocene Forest Stability Predicts Patterns of Frog Diversity in Central Africa"
  url: "https://onlinelibrary.wiley.com/doi/epdf/10.1002/ece3.73207"
data_source:
  title: "How to dynamically retrieve an AmphibiaWeb XML species account"
