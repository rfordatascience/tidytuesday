title: "Avocado Oil Authenticity"
article:
  title: "That Avocado Oil Chip You're Eating May Not Be Made With Pure Avocado Oil"
  url: "https://www.ucdavis.edu/food/news/avocado-oil-chip-youre-eating-may-not-be-made-pure-avocado-oil"
data_source:
  title: "UC Davis Food Quality Lab — Avocado Oil Research"
  url: "https://ucfoodquality.ucdavis.edu/avocado/avocado-oil"
images:
- file: "avocado_oil_pca.jpg"
  alt: >
    PCA biplot of fatty acid profiles from oils extracted from processed foods. Samples classified as consistent with authentic avocado oil cluster together on the right, clearly separated from inconsistent samples that cluster near vegetable oil comparators on the left, demonstrating that chemical fingerprinting can reliably distinguish authentic avocado oil from adulterated products.
