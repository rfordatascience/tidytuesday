
title: "Grambank"
article:
  title: "Grambank reveals the importance of genealogical constraints on linguistic diversity and highlights the impact of language loss"
  url: "https://www.science.org/doi/10.1126/sciadv.adg6175"
data_source:
  title: "Grambank Database v1.0.3 (Zenodo)"
  url: "https://zenodo.org/records/7844558"
images:
- file: "map.png"
  alt: >
    This map displays the global distribution of language samples coded in the Grambank dataset on a world map centered on the Pacific Ocean. Light yellow landmasses contrast against light blue oceans, with thousands of white dots representing sampled languages scattered across the globe. Sampling density varies significantly by region: the highest concentration of overlapping dots covers Papunesia (New Guinea, Island Melanesia, Australia), Southeast Asia, Sub-Saharan Africa (particularly West, Central, and East Africa), Mesoamerica, and the Andean/Amazonian regions of South America. Moderate density extends across North America (notably the West Coast), Western Europe, the Caucasus, and South Asia along the Himalayas. Lower density appears across northern Eurasia (Siberia), interior Australia, and northern North America, reflecting underlying regional language distribution and data coverage.
- file: "variance_explained_by_geography.png"
  alt: >
    This 4-panel scatter plot grid, labeled A through D, compares the proportion of variance explained by phylogeny on the x-axis (0% to 100%) versus geography on the y-axis (0% to 100%) for Grambank features across four distinct linguistic domains. Each panel features individual points accompanied by shaded confidence ellipses and a dashed light-gray diagonal reference line. In Panel A (clause, red circles), data points cluster between 50% and 90% variance explained by phylogeny, with low-to-moderate geographic variance between 0% and 20%, alongside a single outlier showing approximately 5% phylogenetic and 20% geographic variance. In Panel B (nominal domain, orange squares), points cluster strongly near 75% to 100% phylogenetic variance while mostly remaining under 25% geographic variance. In Panel C (pronoun, purple diamonds), points are tightly concentrated along the bottom-right corner, exhibiting 75% to 100% phylogenetic variance and near 0% geographic variance. In Panel D (verbal domain, cyan triangles), points are heavily clustered at 75% to 100% phylogenetic variance with minimal geographic variance, except for one outlier at roughly 35% phylogeny and 25% geography. Across all four domains, linguistic variation is overwhelmingly explained by language family history (phylogeny) rather than spatial proximity (geography).
