images:
- file: "sample_income_distribution_plot.png"
  alt: >
    A bar chart titled 'How has the Self-employed Estonian fared?' showing average income values in Estonia from 2003 to 2023, segmented by self-employment type. The x-axis represents the year, and the y-axis represents the observation value (mean income in Euros). For each year, two side-by-side bars compare 'Income from self-employment' (light blue) and 'Income from self-employment and from goods produced for own consumption' (darker blue). The chart shows a notable dip in average income across both categories in 2004 and 2005, followed by a steady recovery and growth from 2006 through 2023. The 'Income from self-employment' group consistently shows significantly lower average income values than the 'Income from self-employment and from goods produced for own consumption' group.
