images:
- file: "alhambra.png"
  alt: >
    Photograph of the Alhambra in Granada, Spain, seen from across the valley
    in low evening sunlight. The long sandstone complex runs across the frame
    on a wooded ridge, its walls and square crenellated towers lit warm orange
    against a pale blue sky. A tall keep with battlements stands left of
    centre and the boxy Renaissance facade of the Palace of Charles the Fifth
    sits to the right, with dark green woodland and cypresses filling the
    slope below. The Alhambra is ranked seventh of the 5,793 landmarks in this
    dataset, with articles in 95 Wikipedia language editions.
