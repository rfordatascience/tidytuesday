images:
- file: "Comparison-of-Popular-Terms.png"
  alt: >
    A multi-series line chart titled 'Comparison of Popular Terms', created by Dana Gibbon, tracks the usage frequency of 20 lyrical words across songs from 2014 through 2019, measured as a percentage of songs on the y-axis ranging from 0% to over 60%. The word 'wanna' sits at the top of the chart for nearly the entire period, peaking sharply around 70% in 2018, followed closely by high-frequency terms like 'girl' and 'yeah' which hover between 35% and 50%. In contrast, terms like 'drink', 'drinkin', and 'lovin' stay consistently near the bottom of the chart below 15%, while middle-tier terms such as 'tonight', 'night', and 'little' show moderate year-to-year shifts within the 20% to 50% range.
